version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shading-dashboard-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS:-600000}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - CONFIG_PATH=/app/data/config.json
    volumes:
      - ./backend/data:/app/data
    networks:
      - shading-dashboard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:8080
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws}
    container_name: shading-dashboard-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    networks:
      - shading-dashboard-net
    depends_on:
      - backend

networks:
  shading-dashboard-net:
    driver: bridge
